version: 2
updates:
  - package-ecosystem: npm
    directory: /cuarenta-frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
