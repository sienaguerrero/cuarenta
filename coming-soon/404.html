<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under construction</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305506e'/%3E%3Cpath d='M16 4l3 9 9 3-9 3-3 9-3-9-9-3 9-3z' fill='%23fff0aa'/%3E%3C/svg%3E">
<style>
:root {
  --deep: #05506e;
  --sea: #0a86a8;
  --cyan: #22bfd8;
  --foam: #d2f5fb;
  --butter: #fff0aa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font: 13px/1.5 Verdana, Tahoma, "Segoe UI", Geneva, sans-serif;
  color: #111827;
  background-color: var(--cyan);
  background-image:
    radial-gradient(circle at 25% 25%, rgba(255,255,255,.55) 0 1.5px, transparent 2px),
    radial-gradient(circle at 75% 70%, rgba(255,255,255,.4) 0 1px, transparent 1.5px),
    linear-gradient(180deg, var(--cyan) 0%, var(--foam) 100%);
  background-size: 28px 28px, 41px 41px, 100% 100%;
  background-attachment: fixed;
}
.box {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border: 1px solid var(--deep);
  box-shadow: 3px 3px 0 rgba(5, 80, 110, .35);
  text-align: center;
}
.bar {
  margin: 0;
  padding: 4px 8px;
  font: bold 12px Tahoma, Verdana, sans-serif;
  color: #fff;
  text-align: left;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, .35);
  background: linear-gradient(90deg, var(--deep), var(--sea) 70%, var(--cyan));
}
.stripes {
  height: 14px;
  background: repeating-linear-gradient(45deg, #111 0 10px, #ffd400 10px 20px);
  border-block: 1px solid #000;
}
.inner { padding: 18px 16px 20px; }
.cone { font-size: 34px; line-height: 1; color: #f59e0b; margin: 0 0 6px; }
h1 {
  margin: 0 0 4px;
  font: 22px "Arial Black", "Trebuchet MS", sans-serif;
  color: var(--deep);
}
.host { margin: 0 0 12px; font: 13px "Courier New", monospace; color: var(--sea); word-break: break-all; }
p { margin: 0 0 10px; }
a { color: var(--deep); }
a:hover { text-decoration-thickness: 3px; text-decoration-color: var(--cyan); }
.btn {
  display: inline-block;
  margin-top: 4px;
  padding: 4px 12px;
  font: bold 12px Tahoma, Verdana, sans-serif;
  color: #111827;
  text-decoration: none;
  background: linear-gradient(180deg, #fff, #d9dde6);
  border: 2px solid;
  border-color: #fff #8a91a3 #8a91a3 #fff;
  outline: 1px solid #4a5163;
}
.btn:hover { background: linear-gradient(180deg, #fff, var(--butter)); text-decoration: none; }
:focus-visible { outline: 3px dashed var(--sea) !important; outline-offset: 2px; }
</style>
</head>
<body>
<main class="box">
  <h2 class="bar">Coming Soon</h2>
  <div class="stripes" aria-hidden="true"></div>
  <div class="inner">
    <p class="cone" aria-hidden="true">&#9888;</p>
    <h1>Under construction</h1>
    <p class="host" id="host">this site</p>
    <p>This page is getting a fresh coat of paint. Check back soon.</p>
    <a class="btn" href="https://siena.codes">&laquo; back to siena.codes</a>
  </div>
  <div class="stripes" aria-hidden="true"></div>
</main>
<script>
document.getElementById("host").textContent = location.hostname || "this site";
</script>
</body>
</html>
